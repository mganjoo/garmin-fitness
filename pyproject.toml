[project]
name = "garmin-fitness"
version = "0.1.0"
description = "A read-only Garmin fitness data CLI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Garmin Fitness contributors" }]
dependencies = [
    "garminconnect==0.3.11",
]

[project.scripts]
garmin-fetch = "garmin_fitness.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "ruff>=0.12,<0.13",
]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
